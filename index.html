<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ghomedah</title>
</head>

<body>
	<canvas id="c" width="800" height="800"></canvas>
</body>
<script>
	const ctx = document.getElementById('c').getContext('2d');
	const ws = new WebSocket('ws://localhost:8787');

	let id = null;

	// Interpolation
	let samples = [];
	const INTERP_MS = 66;

	const inputs = {
		w: false,
		s: false,
		a: false,
		d: false
	};

	ws.addEventListener("message", (e) => {
		const data = JSON.parse(e.data);

		if (data.type === 'welcome') {
			id = data.payload.id;
		} else if (data.type === 'snapshot') {
			samples.push({ ...data, at: performance.now() })
			if (samples.length > 3) samples.shift();
		}
	});

	function sendInput() {
		ws.send(JSON.stringify({ type: 'input', payload: inputs }));
	};

	window.addEventListener('keydown', (e) => {
		const key = e.key.toLowerCase();

		if (key in inputs && inputs[key] === false) {
			inputs[key] = true;
			sendInput();
		}
	});

	window.addEventListener('keyup', (e) => {
		const key = e.key.toLowerCase();

		if (key in inputs && inputs[key] === true) {
			inputs[key] = false;
			sendInput();
		}
	});

	(function frame() {
		ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, 800, 800);

		if (!samples.length) { requestAnimationFrame(frame); return; }
		const render_at = performance.now() - INTERP_MS;


		let a = samples[0]; let b = samples[samples.length - 1];
		for (let i = 0; i < samples.length - 1; i++)
			if (render_at <= samples[i + 1].at) { a = samples[i]; b = samples[i + 1]; break; }

		const span = b.at - a.at;
		const t = span > 0 ? Math.min(1, Math.max(0, (render_at - a.at) / span)) : 1;

		for (const p of b.players) {
			const q = a.players.find(o => o.id === p.id);
			const x = q ? q.x + (p.x - q.x) * t : p.x;
			const y = q ? q.y + (p.y - q.y) * t : p.y;
			ctx.fillStyle = p.id === id ? '#e8c555' : '#e8c';
			ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
		}


		requestAnimationFrame(frame);
	})();

</script>

</html>
